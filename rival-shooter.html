<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>라이벌 슈터 🎯</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none; }
  html, body { height:100%; overflow:hidden; font-family:'Outfit','Apple SD Gothic Neo',sans-serif; }
  body {
    background: #0a0e1a;
    display:flex; align-items:center; justify-content:center;
    touch-action:none;
  }
  #app {
    width:100%; max-width:480px;
    height:100vh; height:100dvh;
    position:relative; overflow:hidden;
    background: #1a2030;
  }
  canvas { display:block; width:100%; height:100%; touch-action:none; }

  /* HUD */
  .hud {
    position:absolute; top:0; left:0; right:0;
    padding: 10px 12px;
    display:flex; justify-content:space-between; align-items:center;
    z-index:10; pointer-events:none;
    gap: 6px;
  }
  .hud-box {
    background: rgba(20,30,50,0.85);
    backdrop-filter: blur(8px);
    border: 2px solid rgba(255,255,255,0.15);
    border-radius: 12px;
    padding: 6px 10px;
    color: white;
    font-weight: 700;
    font-size: 13px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    display: flex; align-items: center; gap: 6px;
  }
  .hud-box .icon { font-size: 14px; }
  .hud-box.health { border-color: #ff5577; }
  .hud-box.score { border-color: #ffbb33; }
  .hud-box.round { border-color: #44ddff; }
  .hud-box.enemies { border-color: #aaff77; }

  /* 체력바 (좌측 큰거) */
  .health-bar {
    position: absolute;
    bottom: 100px; left: 16px;
    width: 140px; height: 8px;
    background: rgba(20,30,50,0.85);
    border: 2px solid rgba(255,255,255,0.2);
    border-radius: 6px;
    overflow: hidden;
    z-index: 10;
    pointer-events: none;
  }
  .health-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, #ff3366, #ff66aa);
    transition: width 0.2s;
  }

  /* 조이스틱 */
  .joystick {
    position: absolute;
    bottom: 24px;
    width: 100px; height: 100px;
    background: rgba(20,30,50,0.4);
    backdrop-filter: blur(4px);
    border: 2.5px solid rgba(255,255,255,0.25);
    border-radius: 50%;
    z-index: 15;
    pointer-events: auto;
    display: none;
  }
  .joystick.active { display: block; }
  .joystick-stick {
    position: absolute;
    top: 50%; left: 50%;
    width: 44px; height: 44px;
    background: rgba(255,255,255,0.5);
    border-radius: 50%;
    transform: translate(-50%, -50%);
    transition: transform 0.05s;
    box-shadow: 0 2px 8px rgba(0,0,0,0.3);
  }
  .joystick.left { left: 16px; }
  .joystick.right { right: 16px; border-color: rgba(255,80,80,0.4); }
  .joystick.right .joystick-stick { background: rgba(255,80,80,0.7); }

  /* 안내 텍스트 */
  .hint {
    position: absolute;
    bottom: 140px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(20,30,50,0.85);
    color: rgba(255,255,255,0.85);
    padding: 6px 14px;
    border-radius: 14px;
    font-size: 12px;
    z-index: 10;
    pointer-events: none;
    white-space: nowrap;
  }

  /* 시작/결과 화면 */
  .overlay {
    position: absolute; inset: 0;
    background: rgba(10,15,30,0.92);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    z-index: 50;
    color: white;
    padding: 24px;
    text-align: center;
  }
  .overlay.hidden { display: none; }
  .title {
    font-size: 38px;
    font-weight: 900;
    background: linear-gradient(135deg, #ff5577, #ffbb33, #44ddff);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    margin-bottom: 8px;
    text-shadow: 0 0 20px rgba(255,100,150,0.3);
    letter-spacing: -1px;
  }
  .subtitle {
    font-size: 15px; opacity: 0.7;
    margin-bottom: 24px;
  }
  .stats-card {
    background: rgba(255,255,255,0.08);
    border: 2px solid rgba(255,255,255,0.15);
    border-radius: 16px;
    padding: 16px 24px;
    margin: 12px 0 20px;
    min-width: 220px;
  }
  .stat-row {
    display: flex; justify-content: space-between;
    padding: 4px 0;
    font-size: 14px;
  }
  .stat-row .label { opacity: 0.7; }
  .stat-row .value { font-weight: 700; color: #ffbb33; }
  .stat-row.best .value { color: #44ddff; }
  .btn {
    background: linear-gradient(135deg, #ff5577, #c2185b);
    color: white;
    border: none;
    padding: 14px 36px;
    border-radius: 28px;
    font-family: inherit;
    font-size: 17px;
    font-weight: 800;
    cursor: pointer;
    margin: 6px;
    box-shadow: 0 6px 0 #8b0d3e, 0 8px 20px rgba(255,85,119,0.4);
    transition: transform 0.1s;
    letter-spacing: 0.5px;
  }
  .btn:active { transform: translateY(3px); box-shadow: 0 3px 0 #8b0d3e; }
  .btn-blue {
    background: linear-gradient(135deg, #44ddff, #2196f3);
    box-shadow: 0 6px 0 #0d6db8, 0 8px 20px rgba(68,221,255,0.4);
  }
  .btn-blue:active { box-shadow: 0 3px 0 #0d6db8; }
  .controls-info {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 14px;
    padding: 12px 18px;
    margin: 16px 0;
    font-size: 12px;
    line-height: 1.7;
    opacity: 0.8;
    max-width: 320px;
  }
  .controls-info b { color: #ffbb33; }

  /* 라운드 시작 토스트 */
  .round-toast {
    position: absolute;
    top: 40%; left: 50%;
    transform: translate(-50%, -50%);
    background: linear-gradient(135deg, #ffbb33, #ff5577);
    color: white;
    padding: 16px 32px;
    border-radius: 18px;
    font-size: 28px;
    font-weight: 900;
    z-index: 40;
    pointer-events: none;
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    animation: roundShow 1.8s ease-out forwards;
    text-align: center;
    text-shadow: 2px 2px 0 rgba(0,0,0,0.2);
  }
  @keyframes roundShow {
    0% { transform: translate(-50%, -50%) scale(0.5); opacity: 0; }
    20% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; }
    35% { transform: translate(-50%, -50%) scale(1); }
    80% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
    100% { transform: translate(-50%, -50%) scale(0.9); opacity: 0; }
  }

  /* 사운드 토글 */
  .sound-toggle {
    position: absolute;
    top: 10px; right: 10px;
    width: 32px; height: 32px;
    background: rgba(20,30,50,0.85);
    border: 2px solid rgba(255,255,255,0.2);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; font-size: 14px;
    z-index: 60;
    color: white;
  }

  @media (max-height: 620px) {
    .title { font-size: 28px; }
    .subtitle { font-size: 12px; margin-bottom: 14px; }
    .stats-card { padding: 10px 18px; }
    .stat-row { font-size: 12px; }
    .btn { padding: 10px 26px; font-size: 14px; }
    .controls-info { font-size: 10px; padding: 8px 14px; }
    .joystick { width: 80px; height: 80px; bottom: 16px; }
    .joystick-stick { width: 36px; height: 36px; }
    .health-bar { bottom: 80px; width: 110px; }
  }

  /* === 모던 폰트 + 버튼 업그레이드 === */
  .btn {
    background:linear-gradient(135deg, #ff6b9d, #56ccf5) !important;
    border:none !important; border-radius:18px !important;
    box-shadow:0 8px 24px rgba(255,107,157,0.4), inset 0 1px 0 rgba(255,255,255,0.3) !important;
    font-family:'Outfit',sans-serif !important; font-weight:800 !important;
    transition:transform 0.12s, box-shadow 0.12s !important;
    color:#fff !important;
  }
  .btn:hover { transform:translateY(-2px) !important; }
  .btn:active { transform:translateY(1px) !important; }
  .overlay { backdrop-filter:blur(14px) !important; }
</style>
</head>
<body>
<div id="app">
  <canvas id="canvas"></canvas>

  <!-- HUD -->
  <div class="hud">
    <div class="hud-box health"><span class="icon">❤️</span><span id="health-text">100</span></div>
    <div class="hud-box score"><span class="icon">⭐</span><span id="score-text">0</span></div>
    <div class="hud-box round"><span class="icon">🎯</span>R<span id="round-text">1</span></div>
    <div class="hud-box enemies"><span class="icon">👹</span><span id="enemies-text">0</span></div>
  </div>

  <div class="health-bar"><div class="health-bar-fill" id="health-fill" style="width:100%;"></div></div>

  <!-- 조이스틱 (모바일) -->
  <div class="joystick left" id="joy-left">
    <div class="joystick-stick" id="joy-left-stick"></div>
  </div>
  <div class="joystick right" id="joy-right">
    <div class="joystick-stick" id="joy-right-stick"></div>
  </div>

  <button class="sound-toggle" id="sound-toggle" onclick="toggleSound()">🔊</button>

  <!-- 시작 화면 -->
  <div class="overlay" id="start-screen">
    <div class="title">🎯 라이벌 슈터</div>
    <div class="subtitle">적을 모두 처치하라!</div>
    <div class="controls-info" id="controls-info">
      <b>PC</b>: WASD/방향키로 이동, 마우스로 조준, 클릭 발사<br>
      <b>모바일</b>: 좌측 조이스틱 이동, 우측 조이스틱 조준+발사
    </div>
    <button class="btn" onclick="startGame()">▶ 게임 시작</button>
  </div>

  <!-- 게임오버 화면 -->
  <div class="overlay hidden" id="gameover-screen">
    <div class="title" style="font-size:32px;">💀 GAME OVER</div>
    <div class="subtitle">아쉽다! 다시 도전해봐</div>
    <div class="stats-card">
      <div class="stat-row"><span class="label">⭐ 점수</span><span class="value" id="final-score">0</span></div>
      <div class="stat-row"><span class="label">🎯 라운드</span><span class="value" id="final-round">1</span></div>
      <div class="stat-row"><span class="label">💀 처치</span><span class="value" id="final-kills">0</span></div>
      <div class="stat-row best"><span class="label">🏆 최고점수</span><span class="value" id="final-best">0</span></div>
    </div>
    <button class="btn" onclick="startGame()">🔄 다시 도전</button>
  </div>
</div>

<script>
'use strict';

// ============================================================
// 라이벌 슈터 - 탑다운 슈터 게임
// ============================================================

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

// 게임 상태
let gameState = 'menu'; // 'menu' | 'playing' | 'gameover'
let W = 0, H = 0;
let lastTime = 0;
let soundEnabled = true;
let bgmStarted = false;

// 플레이어
const player = {
  x: 0, y: 0,
  radius: 16,
  speed: 220, // px/s
  health: 100,
  maxHealth: 100,
  angle: 0,
  emoji: '😎',
  shootCooldown: 0,
  shootInterval: 0.25, // 초당 4발
  invincible: 0, // 무적 시간 (피격 후)
  shieldTime: 0,
  fastShootTime: 0,
};

// 적/총알/파티클
let enemies = [];
let bullets = [];
let particles = [];
let items = [];
let stars = []; // 배경 별

// 입력
const keys = {};
let mouseX = 0, mouseY = 0;
let mouseDown = false;
const joyLeft = { active: false, dx: 0, dy: 0, startX: 0, startY: 0, touchId: null };
const joyRight = { active: false, dx: 0, dy: 0, startX: 0, startY: 0, touchId: null };
const isTouch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;

// 점수/라운드
let score = 0;
let round = 1;
let kills = 0;
let best = 0;
try { best = parseInt(localStorage.getItem('rival_best') || '0') || 0; } catch(e) {}
try {
  if (localStorage.getItem('rival_sound') === 'off') soundEnabled = false;
} catch(e) {}

// 적 이모지 (다양하게)
const ENEMY_EMOJIS = ['👹', '👺', '🤖', '👽', '💀', '🎃', '👻', '🦹'];
const PLAYER_EMOJIS = ['😎', '🤠', '🦸', '🥷', '🧙', '🦊'];

// ============================================================
// 리사이즈 + 별 생성
// ============================================================
function resize() {
  const rect = canvas.parentElement.getBoundingClientRect();
  W = rect.width;
  H = rect.height;
  canvas.width = W * (window.devicePixelRatio || 1);
  canvas.height = H * (window.devicePixelRatio || 1);
  ctx.setTransform(window.devicePixelRatio || 1, 0, 0, window.devicePixelRatio || 1, 0, 0);
  
  // 배경 별 생성
  if (stars.length === 0) {
    for (let i = 0; i < 50; i++) {
      stars.push({
        x: Math.random() * W,
        y: Math.random() * H,
        size: Math.random() * 2 + 0.5,
        twinkle: Math.random() * Math.PI * 2,
      });
    }
  }
}
window.addEventListener('resize', resize);
resize();

// ============================================================
// 사운드 (WebAudio)
// ============================================================
let audioCtx = null;
let bgmInterval = null;

function initAudio() {
  if (audioCtx) return;
  try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
}

function tone(freq, dur, type, vol) {
  if (!soundEnabled || !audioCtx) return;
  type = type || 'sine'; vol = vol || 0.1;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type; osc.frequency.value = freq;
  const t = audioCtx.currentTime;
  gain.gain.setValueAtTime(0, t);
  gain.gain.linearRampToValueAtTime(vol, t + 0.01);
  gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.start(t); osc.stop(t + dur);
}

function playShoot() {
  if (!soundEnabled || !audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'square';
  const t = audioCtx.currentTime;
  osc.frequency.setValueAtTime(800, t);
  osc.frequency.exponentialRampToValueAtTime(200, t + 0.08);
  gain.gain.setValueAtTime(0.08, t);
  gain.gain.exponentialRampToValueAtTime(0.001, t + 0.08);
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.start(t); osc.stop(t + 0.08);
}

function playHit() {
  if (!soundEnabled || !audioCtx) return;
  const bufSize = audioCtx.sampleRate * 0.08;
  const buf = audioCtx.createBuffer(1, bufSize, audioCtx.sampleRate);
  const data = buf.getChannelData(0);
  for (let i=0; i<bufSize; i++) data[i] = (Math.random()*2-1) * Math.exp(-i/bufSize*8);
  const noise = audioCtx.createBufferSource();
  noise.buffer = buf;
  const gain = audioCtx.createGain();
  gain.gain.value = 0.12;
  noise.connect(gain); gain.connect(audioCtx.destination);
  noise.start();
}

function playKill() {
  [600, 800, 1000].forEach((f, i) => setTimeout(() => tone(f, 0.1, 'triangle', 0.12), i * 50));
}

function playHurt() {
  tone(200, 0.2, 'sawtooth', 0.15);
}

function playPickup() {
  tone(700, 0.08, 'square', 0.12);
  setTimeout(() => tone(1100, 0.12, 'square', 0.12), 60);
}

function playRoundStart() {
  [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => tone(f, 0.15, 'triangle', 0.14), i * 80));
}

function playGameOver() {
  [400, 350, 300, 200].forEach((f, i) => setTimeout(() => tone(f, 0.25, 'sawtooth', 0.12), i * 130));
}

// BGM - 펑크/액션 비트
function startBGM() {
  if (bgmInterval || !soundEnabled || !audioCtx) return;
  const BPM = 130;
  const beat = 60000 / BPM;

  // 베이스 (E minor 진행: E - G - A - B)
  const BASS = [
    { n: 82.41, t: 0 }, { n: 82.41, t: 1.5 }, { n: 123.47, t: 2 }, { n: 82.41, t: 3 }, { n: 164.81, t: 3.5 },
    { n: 98, t: 4 }, { n: 98, t: 5.5 }, { n: 146.83, t: 6 }, { n: 98, t: 7 }, { n: 196, t: 7.5 },
    { n: 110, t: 8 }, { n: 110, t: 9.5 }, { n: 164.81, t: 10 }, { n: 110, t: 11 }, { n: 220, t: 11.5 },
    { n: 123.47, t: 12 }, { n: 123.47, t: 13.5 }, { n: 185, t: 14 }, { n: 123.47, t: 15 }, { n: 246.94, t: 15.5 },
  ];

  const DRUMS = [];
  for (let bar = 0; bar < 4; bar++) {
    const base = bar * 4;
    DRUMS.push({ type: 'kick', t: base + 0 });
    DRUMS.push({ type: 'kick', t: base + 2 });
    DRUMS.push({ type: 'kick', t: base + 2.5 });
    DRUMS.push({ type: 'snare', t: base + 1 });
    DRUMS.push({ type: 'snare', t: base + 3 });
    for (let i = 0; i < 8; i++) DRUMS.push({ type: 'hihat', t: base + i * 0.5 });
  }

  const patternLengthMs = 16 * beat;

  function playBassNote(freq, when) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.value = freq;
    const t = audioCtx.currentTime + when;
    gain.gain.setValueAtTime(0, t);
    gain.gain.linearRampToValueAtTime(0.05, t + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.001, t + 0.3);
    const filter = audioCtx.createBiquadFilter();
    filter.type = 'lowpass'; filter.frequency.value = 600;
    osc.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination);
    osc.start(t); osc.stop(t + 0.35);
  }

  function playKick(when) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    const t = audioCtx.currentTime + when;
    osc.frequency.setValueAtTime(120, t);
    osc.frequency.exponentialRampToValueAtTime(40, t + 0.1);
    gain.gain.setValueAtTime(0.18, t);
    gain.gain.exponentialRampToValueAtTime(0.001, t + 0.15);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(t); osc.stop(t + 0.15);
  }
  function playSnare(when) {
    if (!audioCtx) return;
    const bufSize = audioCtx.sampleRate * 0.1;
    const buf = audioCtx.createBuffer(1, bufSize, audioCtx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i=0; i<bufSize; i++) data[i] = (Math.random()*2-1) * Math.exp(-i/bufSize*8);
    const noise = audioCtx.createBufferSource();
    noise.buffer = buf;
    const filter = audioCtx.createBiquadFilter();
    filter.type = 'highpass'; filter.frequency.value = 1500;
    const gain = audioCtx.createGain(); gain.gain.value = 0.08;
    const t = audioCtx.currentTime + when;
    noise.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination);
    noise.start(t);
  }
  function playHihat(when) {
    if (!audioCtx) return;
    const bufSize = audioCtx.sampleRate * 0.04;
    const buf = audioCtx.createBuffer(1, bufSize, audioCtx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i=0; i<bufSize; i++) data[i] = (Math.random()*2-1) * Math.exp(-i/bufSize*15);
    const noise = audioCtx.createBufferSource();
    noise.buffer = buf;
    const filter = audioCtx.createBiquadFilter();
    filter.type = 'highpass'; filter.frequency.value = 7000;
    const gain = audioCtx.createGain(); gain.gain.value = 0.025;
    const t = audioCtx.currentTime + when;
    noise.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination);
    noise.start(t);
  }

  function scheduleBar() {
    if (!soundEnabled) return;
    BASS.forEach(note => playBassNote(note.n, (note.t * beat) / 1000));
    DRUMS.forEach(d => {
      const when = (d.t * beat) / 1000;
      if (d.type === 'kick') playKick(when);
      else if (d.type === 'snare') playSnare(when);
      else if (d.type === 'hihat') playHihat(when);
    });
  }
  scheduleBar();
  bgmInterval = setInterval(() => {
    if (!soundEnabled) { stopBGM(); return; }
    scheduleBar();
  }, patternLengthMs);
}
function stopBGM() {
  if (bgmInterval) { clearInterval(bgmInterval); bgmInterval = null; }
}

function toggleSound() {
  soundEnabled = !soundEnabled;
  try { localStorage.setItem('rival_sound', soundEnabled ? 'on' : 'off'); } catch(e) {}
  document.getElementById('sound-toggle').textContent = soundEnabled ? '🔊' : '🔇';
  if (soundEnabled) { initAudio(); if (gameState === 'playing') startBGM(); }
  else stopBGM();
}
window.toggleSound = toggleSound;

// ============================================================
// 게임 시작
// ============================================================
function startGame() {
  initAudio();
  if (soundEnabled && !bgmStarted) { startBGM(); bgmStarted = true; }
  
  document.getElementById('start-screen').classList.add('hidden');
  document.getElementById('gameover-screen').classList.add('hidden');
  
  gameState = 'playing';
  score = 0;
  round = 1;
  kills = 0;
  
  // 플레이어 초기화
  player.x = W / 2;
  player.y = H / 2;
  player.health = 100;
  player.maxHealth = 100;
  player.invincible = 0;
  player.shieldTime = 0;
  player.fastShootTime = 0;
  player.emoji = PLAYER_EMOJIS[Math.floor(Math.random() * PLAYER_EMOJIS.length)];
  
  enemies = [];
  bullets = [];
  particles = [];
  items = [];
  
  if (isTouch) {
    document.getElementById('joy-left').classList.add('active');
    document.getElementById('joy-right').classList.add('active');
  }
  
  startRound();
  updateHUD();
}
window.startGame = startGame;

// ============================================================
// 라운드 시스템
// ============================================================
function startRound() {
  // 적 수: 라운드 + 2 (1라운드 3마리, 2라운드 4마리...)
  const numEnemies = Math.min(round + 2, 12);
  for (let i = 0; i < numEnemies; i++) {
    spawnEnemy();
  }
  showRoundToast('ROUND ' + round);
  playRoundStart();
}

function spawnEnemy() {
  // 화면 가장자리에서 스폰
  const side = Math.floor(Math.random() * 4);
  let x, y;
  const margin = 30;
  if (side === 0) { x = Math.random() * W; y = -margin; }
  else if (side === 1) { x = W + margin; y = Math.random() * H; }
  else if (side === 2) { x = Math.random() * W; y = H + margin; }
  else { x = -margin; y = Math.random() * H; }

  const baseSpeed = 60 + round * 8; // 라운드마다 조금씩 빠르게
  enemies.push({
    x, y,
    radius: 14,
    speed: baseSpeed + Math.random() * 30,
    health: 1 + Math.floor(round / 3),
    maxHealth: 1 + Math.floor(round / 3),
    angle: 0,
    emoji: ENEMY_EMOJIS[Math.floor(Math.random() * ENEMY_EMOJIS.length)],
    shootCooldown: 1 + Math.random() * 2, // 첫 발사 딜레이
    shootInterval: Math.max(0.8, 2.2 - round * 0.1), // 라운드가 올라갈수록 자주 쏨
    moveAngle: 0,
    moveTimer: 0,
  });
}

function spawnItem(x, y) {
  // 30% 확률로 아이템 드롭
  if (Math.random() > 0.3) return;
  const types = ['health', 'fast', 'shield'];
  const type = types[Math.floor(Math.random() * types.length)];
  const emoji = type === 'health' ? '❤️' : type === 'fast' ? '⚡' : '🛡️';
  items.push({ x, y, type, emoji, life: 8, pulse: 0 });
}

function showRoundToast(text) {
  const toast = document.createElement('div');
  toast.className = 'round-toast';
  toast.textContent = text;
  document.getElementById('app').appendChild(toast);
  setTimeout(() => toast.remove(), 1800);
}

// ============================================================
// 게임 오버
// ============================================================
function gameOver() {
  gameState = 'gameover';
  document.getElementById('joy-left').classList.remove('active');
  document.getElementById('joy-right').classList.remove('active');
  
  if (score > best) {
    best = score;
    try { localStorage.setItem('rival_best', best); } catch(e) {}
  }
  
  document.getElementById('final-score').textContent = score.toLocaleString();
  document.getElementById('final-round').textContent = round;
  document.getElementById('final-kills').textContent = kills;
  document.getElementById('final-best').textContent = best.toLocaleString();
  document.getElementById('gameover-screen').classList.remove('hidden');
  playGameOver();
}

// ============================================================
// 입력 - 키보드
// ============================================================
window.addEventListener('keydown', (e) => {
  keys[e.key.toLowerCase()] = true;
  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key)) e.preventDefault();
});
window.addEventListener('keyup', (e) => { keys[e.key.toLowerCase()] = false; });

// 마우스
canvas.addEventListener('mousemove', (e) => {
  const rect = canvas.getBoundingClientRect();
  mouseX = e.clientX - rect.left;
  mouseY = e.clientY - rect.top;
});
canvas.addEventListener('mousedown', (e) => {
  initAudio();
  if (soundEnabled && !bgmStarted && gameState === 'playing') { startBGM(); bgmStarted = true; }
  mouseDown = true;
  const rect = canvas.getBoundingClientRect();
  mouseX = e.clientX - rect.left;
  mouseY = e.clientY - rect.top;
});
canvas.addEventListener('mouseup', () => { mouseDown = false; });
canvas.addEventListener('mouseleave', () => { mouseDown = false; });

// ============================================================
// 입력 - 터치 (조이스틱)
// ============================================================
function setupJoystick(elemId, stickId, joyObj) {
  const elem = document.getElementById(elemId);
  const stick = document.getElementById(stickId);
  const rect = () => elem.getBoundingClientRect();
  
  elem.addEventListener('touchstart', (e) => {
    e.preventDefault();
    initAudio();
    if (soundEnabled && !bgmStarted && gameState === 'playing') { startBGM(); bgmStarted = true; }
    if (joyObj.active) return;
    const touch = e.changedTouches[0];
    joyObj.active = true;
    joyObj.touchId = touch.identifier;
    const r = rect();
    joyObj.startX = r.left + r.width / 2;
    joyObj.startY = r.top + r.height / 2;
    updateStick(touch.clientX, touch.clientY);
  }, { passive: false });
  
  function updateStick(cx, cy) {
    const dx = cx - joyObj.startX;
    const dy = cy - joyObj.startY;
    const dist = Math.hypot(dx, dy);
    const max = 45;
    if (dist > max) {
      joyObj.dx = (dx / dist) * max;
      joyObj.dy = (dy / dist) * max;
    } else {
      joyObj.dx = dx;
      joyObj.dy = dy;
    }
    stick.style.transform = `translate(calc(-50% + ${joyObj.dx}px), calc(-50% + ${joyObj.dy}px))`;
  }
  
  function endTouch() {
    joyObj.active = false;
    joyObj.dx = 0;
    joyObj.dy = 0;
    joyObj.touchId = null;
    stick.style.transform = 'translate(-50%, -50%)';
  }
  
  document.addEventListener('touchmove', (e) => {
    if (!joyObj.active) return;
    for (const t of e.changedTouches) {
      if (t.identifier === joyObj.touchId) {
        updateStick(t.clientX, t.clientY);
        break;
      }
    }
  }, { passive: false });
  
  document.addEventListener('touchend', (e) => {
    for (const t of e.changedTouches) {
      if (t.identifier === joyObj.touchId) {
        endTouch();
        break;
      }
    }
  });
  document.addEventListener('touchcancel', endTouch);
}
setupJoystick('joy-left', 'joy-left-stick', joyLeft);
setupJoystick('joy-right', 'joy-right-stick', joyRight);

// ============================================================
// 업데이트
// ============================================================
function update(dt) {
  if (gameState !== 'playing') return;
  
  // 무적 시간 감소
  if (player.invincible > 0) player.invincible -= dt;
  if (player.shieldTime > 0) player.shieldTime -= dt;
  if (player.fastShootTime > 0) player.fastShootTime -= dt;
  
  // 플레이어 이동
  let mx = 0, my = 0;
  if (keys['w'] || keys['arrowup']) my -= 1;
  if (keys['s'] || keys['arrowdown']) my += 1;
  if (keys['a'] || keys['arrowleft']) mx -= 1;
  if (keys['d'] || keys['arrowright']) mx += 1;
  if (joyLeft.active) {
    mx = joyLeft.dx / 45;
    my = joyLeft.dy / 45;
  }
  const mag = Math.hypot(mx, my);
  if (mag > 1) { mx /= mag; my /= mag; }
  player.x += mx * player.speed * dt;
  player.y += my * player.speed * dt;
  player.x = Math.max(player.radius, Math.min(W - player.radius, player.x));
  player.y = Math.max(player.radius, Math.min(H - player.radius, player.y));
  
  // 조준 + 발사
  let aimX = mouseX, aimY = mouseY;
  let shouldShoot = mouseDown;
  
  if (joyRight.active && Math.hypot(joyRight.dx, joyRight.dy) > 10) {
    // 우측 조이스틱 사용 중: 그쪽 방향으로 자동 발사
    aimX = player.x + joyRight.dx * 10;
    aimY = player.y + joyRight.dy * 10;
    shouldShoot = true;
  } else if (isTouch) {
    // 터치 디바이스인데 우조이스틱 안 쓰면 가장 가까운 적 자동 조준
    const closest = findClosestEnemy();
    if (closest) {
      aimX = closest.x;
      aimY = closest.y;
      shouldShoot = true;
    }
  }
  
  player.angle = Math.atan2(aimY - player.y, aimX - player.x);
  
  player.shootCooldown -= dt;
  const interval = player.fastShootTime > 0 ? player.shootInterval * 0.4 : player.shootInterval;
  if (shouldShoot && player.shootCooldown <= 0) {
    fireBullet(player.x, player.y, player.angle, 'player');
    player.shootCooldown = interval;
    playShoot();
  }
  
  // 적 업데이트
  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    
    // 플레이어 향해 이동
    const dx = player.x - e.x;
    const dy = player.y - e.y;
    const dist = Math.hypot(dx, dy);
    
    // 일정 거리 유지 (너무 가까이 안 옴 - 라운드 1-3) 또는 가까이 (4+)
    const idealDist = round <= 3 ? 200 : 120;
    if (dist > idealDist + 20) {
      e.x += (dx / dist) * e.speed * dt;
      e.y += (dy / dist) * e.speed * dt;
    } else if (dist < idealDist - 20) {
      e.x -= (dx / dist) * e.speed * 0.5 * dt;
      e.y -= (dy / dist) * e.speed * 0.5 * dt;
    } else {
      // 측면 이동
      e.moveTimer -= dt;
      if (e.moveTimer <= 0) {
        e.moveAngle = Math.random() * Math.PI * 2;
        e.moveTimer = 0.6 + Math.random();
      }
      e.x += Math.cos(e.moveAngle) * e.speed * 0.4 * dt;
      e.y += Math.sin(e.moveAngle) * e.speed * 0.4 * dt;
    }
    
    // 화면 안에 가두기 (스폰 직후엔 자유롭게)
    if (e.x > -50 && e.x < W + 50) e.x = Math.max(e.radius, Math.min(W - e.radius, e.x));
    if (e.y > -50 && e.y < H + 50) e.y = Math.max(e.radius, Math.min(H - e.radius, e.y));
    
    e.angle = Math.atan2(dy, dx);
    
    // 발사
    e.shootCooldown -= dt;
    if (e.shootCooldown <= 0 && dist < 400) {
      fireBullet(e.x, e.y, e.angle, 'enemy');
      e.shootCooldown = e.shootInterval;
    }
  }
  
  // 총알 업데이트
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    b.x += b.vx * dt;
    b.y += b.vy * dt;
    b.life -= dt;
    
    if (b.life <= 0 || b.x < -20 || b.x > W + 20 || b.y < -20 || b.y > H + 20) {
      bullets.splice(i, 1);
      continue;
    }
    
    // 충돌 검사
    if (b.owner === 'player') {
      // 적과 충돌?
      for (let j = enemies.length - 1; j >= 0; j--) {
        const e = enemies[j];
        if (Math.hypot(b.x - e.x, b.y - e.y) < b.radius + e.radius) {
          // 적 피격
          e.health--;
          bullets.splice(i, 1);
          spawnHitParticle(b.x, b.y, '#ffbb33');
          playHit();
          if (e.health <= 0) {
            // 처치!
            spawnExplosion(e.x, e.y, '#ff66aa');
            spawnItem(e.x, e.y);
            enemies.splice(j, 1);
            kills++;
            score += 100;
            playKill();
            updateHUD();
            
            // 모든 적 처치 → 다음 라운드
            if (enemies.length === 0) {
              score += round * 50; // 라운드 클리어 보너스
              round++;
              setTimeout(() => {
                if (gameState === 'playing') startRound();
              }, 1500);
            }
          }
          break;
        }
      }
    } else {
      // 플레이어와 충돌?
      if (player.invincible <= 0 &&
          Math.hypot(b.x - player.x, b.y - player.y) < b.radius + player.radius) {
        bullets.splice(i, 1);
        if (player.shieldTime > 0) {
          // 방패: 흡수
          spawnHitParticle(b.x, b.y, '#44ddff');
          playHit();
        } else {
          player.health -= 10;
          spawnHitParticle(b.x, b.y, '#ff3366');
          playHurt();
          player.invincible = 0.4;
          updateHUD();
          if (player.health <= 0) {
            spawnExplosion(player.x, player.y, '#ff5577');
            gameOver();
            return;
          }
        }
      }
    }
  }
  
  // 아이템 업데이트
  for (let i = items.length - 1; i >= 0; i--) {
    const it = items[i];
    it.life -= dt;
    it.pulse += dt * 4;
    if (it.life <= 0) {
      items.splice(i, 1);
      continue;
    }
    // 플레이어와 충돌
    if (Math.hypot(it.x - player.x, it.y - player.y) < 24 + player.radius) {
      if (it.type === 'health') {
        player.health = Math.min(player.maxHealth, player.health + 30);
      } else if (it.type === 'fast') {
        player.fastShootTime = 8;
      } else if (it.type === 'shield') {
        player.shieldTime = 6;
      }
      items.splice(i, 1);
      playPickup();
      spawnHitParticle(it.x, it.y, '#aaff77');
      updateHUD();
    }
  }
  
  // 파티클 업데이트
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.life -= dt;
    p.vx *= 0.92;
    p.vy *= 0.92;
    if (p.life <= 0) particles.splice(i, 1);
  }
  
  // 별 깜빡
  stars.forEach(s => { s.twinkle += dt * 2; });
}

function findClosestEnemy() {
  let closest = null;
  let minDist = Infinity;
  for (const e of enemies) {
    const d = Math.hypot(e.x - player.x, e.y - player.y);
    if (d < minDist && d < 350) {
      minDist = d;
      closest = e;
    }
  }
  return closest;
}

function fireBullet(x, y, angle, owner) {
  const speed = owner === 'player' ? 500 : 280;
  bullets.push({
    x, y,
    vx: Math.cos(angle) * speed,
    vy: Math.sin(angle) * speed,
    radius: owner === 'player' ? 4 : 5,
    owner,
    life: 1.5,
    color: owner === 'player' ? '#ffbb33' : '#ff66aa',
  });
}

function spawnHitParticle(x, y, color) {
  for (let i = 0; i < 6; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 80 + Math.random() * 100;
    particles.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      life: 0.4,
      maxLife: 0.4,
      size: 3 + Math.random() * 2,
      color,
    });
  }
}

function spawnExplosion(x, y, color) {
  for (let i = 0; i < 20; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 100 + Math.random() * 200;
    particles.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      life: 0.8,
      maxLife: 0.8,
      size: 4 + Math.random() * 3,
      color,
    });
  }
  // 별 파티클
  for (let i = 0; i < 8; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 60 + Math.random() * 80;
    particles.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      life: 1,
      maxLife: 1,
      size: 14,
      color: '#ffff66',
      isStar: true,
    });
  }
}

function updateHUD() {
  document.getElementById('health-text').textContent = Math.max(0, Math.round(player.health));
  document.getElementById('score-text').textContent = score.toLocaleString();
  document.getElementById('round-text').textContent = round;
  document.getElementById('enemies-text').textContent = enemies.length;
  document.getElementById('health-fill').style.width = (player.health / player.maxHealth * 100) + '%';
}

// ============================================================
// 렌더링
// ============================================================
function render() {
  // 배경
  ctx.fillStyle = '#1a2030';
  ctx.fillRect(0, 0, W, H);
  
  // 그리드 패턴
  ctx.strokeStyle = 'rgba(255,255,255,0.04)';
  ctx.lineWidth = 1;
  const gridSize = 40;
  for (let x = 0; x < W; x += gridSize) {
    ctx.beginPath();
    ctx.moveTo(x, 0);
    ctx.lineTo(x, H);
    ctx.stroke();
  }
  for (let y = 0; y < H; y += gridSize) {
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(W, y);
    ctx.stroke();
  }
  
  // 별
  for (const s of stars) {
    const alpha = 0.3 + Math.sin(s.twinkle) * 0.2;
    ctx.fillStyle = `rgba(255,255,255,${alpha})`;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
    ctx.fill();
  }
  
  if (gameState !== 'playing' && gameState !== 'gameover') return;
  
  // 아이템
  for (const it of items) {
    const scale = 1 + Math.sin(it.pulse) * 0.15;
    ctx.save();
    ctx.translate(it.x, it.y);
    ctx.scale(scale, scale);
    // 반짝이는 후광
    const grad = ctx.createRadialGradient(0, 0, 0, 0, 0, 24);
    const itColor = it.type === 'health' ? 'rgba(255,80,120,0.5)' : 
                    it.type === 'fast' ? 'rgba(255,220,80,0.5)' : 'rgba(80,220,255,0.5)';
    grad.addColorStop(0, itColor);
    grad.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = grad;
    ctx.beginPath(); ctx.arc(0, 0, 24, 0, Math.PI * 2); ctx.fill();
    ctx.font = '24px serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(it.emoji, 0, 0);
    ctx.restore();
  }
  
  // 플레이어
  if (gameState === 'playing') {
    drawCharacter(player.x, player.y, player.emoji, player.angle, 
                  player.invincible > 0 && Math.floor(player.invincible * 20) % 2 === 0 ? 0.4 : 1);
    
    // 방패 표시
    if (player.shieldTime > 0) {
      ctx.strokeStyle = `rgba(80,220,255,${0.5 + Math.sin(Date.now() / 100) * 0.3})`;
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(player.x, player.y, player.radius + 8, 0, Math.PI * 2);
      ctx.stroke();
    }
    
    // 빠른 발사 표시
    if (player.fastShootTime > 0) {
      ctx.fillStyle = `rgba(255,220,80,${0.3 + Math.sin(Date.now() / 80) * 0.2})`;
      ctx.beginPath();
      ctx.arc(player.x, player.y - 24, 6, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = 'white';
      ctx.font = 'bold 10px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('⚡', player.x, player.y - 21);
    }
    
    // 조준선
    let aimX = mouseX, aimY = mouseY;
    if (joyRight.active && Math.hypot(joyRight.dx, joyRight.dy) > 10) {
      aimX = player.x + joyRight.dx * 10;
      aimY = player.y + joyRight.dy * 10;
    } else if (isTouch) {
      const closest = findClosestEnemy();
      if (closest) { aimX = closest.x; aimY = closest.y; }
    }
    const aimAngle = Math.atan2(aimY - player.y, aimX - player.x);
    ctx.strokeStyle = 'rgba(255,255,255,0.25)';
    ctx.lineWidth = 2;
    ctx.setLineDash([4, 6]);
    ctx.beginPath();
    ctx.moveTo(player.x + Math.cos(aimAngle) * 24, player.y + Math.sin(aimAngle) * 24);
    ctx.lineTo(player.x + Math.cos(aimAngle) * 200, player.y + Math.sin(aimAngle) * 200);
    ctx.stroke();
    ctx.setLineDash([]);
  }
  
  // 적
  for (const e of enemies) {
    drawCharacter(e.x, e.y, e.emoji, e.angle, 1);
    
    // 체력바
    if (e.maxHealth > 1) {
      const bw = 24, bh = 4;
      ctx.fillStyle = 'rgba(0,0,0,0.5)';
      ctx.fillRect(e.x - bw/2, e.y - e.radius - 12, bw, bh);
      ctx.fillStyle = '#ff5577';
      ctx.fillRect(e.x - bw/2, e.y - e.radius - 12, bw * (e.health / e.maxHealth), bh);
    }
  }
  
  // 총알
  for (const b of bullets) {
    ctx.fillStyle = b.color;
    ctx.shadowColor = b.color;
    ctx.shadowBlur = 12;
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
  }
  
  // 파티클
  for (const p of particles) {
    const alpha = p.life / p.maxLife;
    if (p.isStar) {
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.globalAlpha = alpha;
      ctx.font = p.size + 'px serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('✨', 0, 0);
      ctx.restore();
    } else {
      ctx.fillStyle = p.color;
      ctx.globalAlpha = alpha;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size * alpha, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;
    }
  }
}

function drawCharacter(x, y, emoji, angle, alpha) {
  ctx.save();
  ctx.globalAlpha = alpha || 1;
  // 그림자
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.beginPath();
  ctx.ellipse(x, y + 14, 14, 4, 0, 0, Math.PI * 2);
  ctx.fill();
  // 총 방향 표시 (원형 배경)
  ctx.translate(x, y);
  ctx.rotate(angle);
  ctx.fillStyle = 'rgba(255,255,255,0.15)';
  ctx.fillRect(8, -3, 18, 6);
  ctx.fillStyle = 'rgba(60,60,80,0.9)';
  ctx.fillRect(14, -2, 12, 4);
  ctx.rotate(-angle);
  // 캐릭터 이모지
  ctx.font = 'bold 28px serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(emoji, 0, 0);
  ctx.restore();
}

// ============================================================
// 게임 루프
// ============================================================
function loop(now) {
  if (!lastTime) lastTime = now;
  const dt = Math.min(0.05, (now - lastTime) / 1000);
  lastTime = now;
  update(dt);
  render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// 초기 음소거 상태 반영
document.getElementById('sound-toggle').textContent = soundEnabled ? '🔊' : '🔇';

console.log('Rival Shooter loaded');
</script>
