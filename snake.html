<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>스네이크 🐍</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none; }
  html, body { height:100%; overflow:hidden; font-family:'Outfit','Apple SD Gothic Neo',sans-serif; }
  body { background:#a8e6a3; display:flex; align-items:center; justify-content:center; touch-action:none; }
  #app {
    width:100%; max-width:480px; height:100vh; height:100dvh;
    position:relative; overflow:hidden;
    background: linear-gradient(180deg, #b8f0b3 0%, #98e093 100%);
    display:flex; flex-direction:column;
  }
  .header { padding:14px 16px 8px; display:flex; justify-content:space-between; align-items:center; }
  .title { font-size:26px; font-weight:900; color:#2d5a2d; }
  .scores { display:flex; gap:8px; }
  .score-box {
    background:rgba(255,255,255,0.7); border-radius:12px; padding:6px 14px; text-align:center;
    border:2px solid #2d5a2d;
  }
  .score-box .label { font-size:9px; font-weight:700; color:#4a7a4a; letter-spacing:1px; }
  .score-box .value { font-size:18px; font-weight:900; color:#2d5a2d; }
  .game-area { flex:1; display:flex; align-items:center; justify-content:center; padding:8px; }
  canvas { background:#c8f0c3; border-radius:16px; box-shadow:0 8px 24px rgba(0,0,0,0.12); touch-action:none; max-width:100%; max-height:100%; }
  .controls { display:none; padding:0 16px 16px; }
  .controls.active { display:block; }
  .dpad { display:grid; grid-template-columns:repeat(3,60px); grid-template-rows:repeat(3,60px); gap:6px; justify-content:center; }
  .dpad-btn {
    background:rgba(255,255,255,0.7); border:2.5px solid #2d5a2d; border-radius:14px;
    font-size:24px; color:#2d5a2d; cursor:pointer; display:flex; align-items:center; justify-content:center;
  }
  .dpad-btn:active { background:#2d5a2d; color:white; }
  .dpad-btn.empty { visibility:hidden; }
  .overlay {
    position:absolute; inset:0; background:rgba(45,90,45,0.92); display:flex; flex-direction:column;
    align-items:center; justify-content:center; z-index:50; color:white; padding:24px; text-align:center;
  }
  .overlay.hidden { display:none; }
  .big-emoji { font-size:64px; margin-bottom:8px; }
  .o-title { font-size:34px; font-weight:900; margin-bottom:6px; }
  .o-sub { font-size:14px; opacity:0.85; margin-bottom:20px; line-height:1.5; }
  .o-score { font-size:44px; font-weight:900; color:#ffe066; margin:8px 0; }
  .btn {
    background:#ffe066; color:#2d5a2d; border:none; padding:14px 36px; border-radius:28px;
    font-family:inherit; font-size:17px; font-weight:800; cursor:pointer; margin:6px;
    box-shadow:0 5px 0 #d4b840; transition:transform 0.1s;
  }
  .btn:active { transform:translateY(3px); box-shadow:0 2px 0 #d4b840; }
  .sound-toggle {
    position:absolute; top:12px; right:12px; width:32px; height:32px; z-index:60;
    background:rgba(255,255,255,0.7); border:2px solid #2d5a2d; border-radius:50%;
    display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:14px;
  }

  /* === 모던 디자인 업그레이드 === */
  body { background:#0d1a12 !important; }
  #app {
    background:
      radial-gradient(circle at 18% 0%, rgba(74,222,128,0.18), transparent 45%),
      radial-gradient(circle at 82% 100%, rgba(34,197,94,0.15), transparent 45%),
      linear-gradient(180deg, #0d1a12 0%, #0d1a12 100%) !important;
  }
  .overlay { background:rgba(13,11,26,0.82) !important; backdrop-filter:blur(16px) !important; }
  .btn {
    background:linear-gradient(135deg, #4ade80, #22c55e) !important;
    border:none !important; border-radius:18px !important;
    box-shadow:0 8px 24px rgba(74,222,128,0.18), inset 0 1px 0 rgba(255,255,255,0.3) !important;
    font-family:'Outfit',sans-serif !important; font-weight:800 !important;
    transition:transform 0.12s, box-shadow 0.12s !important;
    color:#fff !important;
  }
  .btn:hover { transform:translateY(-2px) !important; }
  .btn:active { transform:translateY(1px) !important; }
  .o-title, .title { letter-spacing:-0.3px; }
  .sound-toggle {
    background:rgba(255,255,255,0.06) !important;
    border:1px solid rgba(255,255,255,0.14) !important;
    backdrop-filter:blur(8px) !important;
  }
</style>
</head>
<body>
<div id="app">
  <div class="header">
    <div class="title">🐍 스네이크</div>
    <div class="scores">
      <div class="score-box"><div class="label">점수</div><div class="value" id="score">0</div></div>
      <div class="score-box"><div class="label">최고</div><div class="value" id="best">0</div></div>
    </div>
  </div>
  <div class="game-area"><canvas id="canvas"></canvas></div>
  <div class="controls" id="controls">
    <div class="dpad">
      <div class="dpad-btn empty"></div>
      <div class="dpad-btn" id="btn-up">▲</div>
      <div class="dpad-btn empty"></div>
      <div class="dpad-btn" id="btn-left">◀</div>
      <div class="dpad-btn empty"></div>
      <div class="dpad-btn" id="btn-right">▶</div>
      <div class="dpad-btn empty"></div>
      <div class="dpad-btn" id="btn-down">▼</div>
      <div class="dpad-btn empty"></div>
    </div>
  </div>
  <button class="sound-toggle" id="sound-toggle" onclick="toggleSound()">🔊</button>
  <div class="overlay" id="start-screen">
    <div class="big-emoji">🐍</div>
    <div class="o-title">스네이크</div>
    <div class="o-sub">사과를 먹고 점점 길어져요!<br>벽과 몸에 부딪히면 끝<br><br>방향키 / 스와이프 / 버튼</div>
    <button class="btn" onclick="startGame()">▶ 시작</button>
  </div>
  <div class="overlay hidden" id="gameover-screen">
    <div class="big-emoji">💥</div>
    <div class="o-title">게임 오버!</div>
    <div class="o-score" id="final-score">0</div>
    <div class="o-sub">먹은 사과: <b id="final-apples">0</b>개</div>
    <button class="btn" onclick="startGame()">🔄 다시</button>
  </div>
</div>
<script>
'use strict';
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const GRID = 17;
let cellSize = 20;
let snake, dir, nextDir, food, score, best, gameState='menu', moveTimer, moveInterval, apples;
let soundEnabled = true;
const isTouch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
try { best = parseInt(localStorage.getItem('snake_best')||'0')||0; if(localStorage.getItem('snake_sound')==='off') soundEnabled=false; } catch(e){ best=0; }

let audioCtx=null;
function initAudio(){ if(audioCtx)return; try{audioCtx=new(window.AudioContext||window.webkitAudioContext)();}catch(e){} }
function tone(f,d,t,v){ if(!soundEnabled||!audioCtx)return; t=t||'sine';v=v||0.1; const o=audioCtx.createOscillator(),g=audioCtx.createGain(); o.type=t;o.frequency.value=f; const n=audioCtx.currentTime; g.gain.setValueAtTime(0,n);g.gain.linearRampToValueAtTime(v,n+0.01);g.gain.exponentialRampToValueAtTime(0.001,n+d); o.connect(g);g.connect(audioCtx.destination);o.start(n);o.stop(n+d); }
function playEat(){ tone(600,0.08,'square',0.1); setTimeout(()=>tone(900,0.1,'square',0.1),50); }
function playDie(){ [400,300,200].forEach((f,i)=>setTimeout(()=>tone(f,0.15,'sawtooth',0.1),i*100)); }
function toggleSound(){ soundEnabled=!soundEnabled; try{localStorage.setItem('snake_sound',soundEnabled?'on':'off');}catch(e){} document.getElementById('sound-toggle').textContent=soundEnabled?'🔊':'🔇'; }
window.toggleSound=toggleSound;

function resize(){
  const area = canvas.parentElement.getBoundingClientRect();
  const size = Math.min(area.width-16, area.height-16, 440);
  cellSize = Math.floor(size / GRID);
  canvas.width = canvas.height = cellSize * GRID;
}
window.addEventListener('resize', ()=>{ resize(); draw(); });

function startGame(){
  initAudio();
  document.getElementById('start-screen').classList.add('hidden');
  document.getElementById('gameover-screen').classList.add('hidden');
  if(isTouch) document.getElementById('controls').classList.add('active');
  resize();
  snake = [{x:8,y:8},{x:7,y:8},{x:6,y:8}];
  dir = {x:1,y:0}; nextDir = {x:1,y:0};
  score = 0; apples = 0;
  moveInterval = 0.13; moveTimer = 0;
  placeFood();
  gameState = 'playing';
  updateScore();
}
window.startGame = startGame;

function placeFood(){
  while(true){
    food = { x:Math.floor(Math.random()*GRID), y:Math.floor(Math.random()*GRID) };
    if(!snake.some(s=>s.x===food.x&&s.y===food.y)) break;
  }
}
function updateScore(){
  document.getElementById('score').textContent = score;
  if(score>best){ best=score; try{localStorage.setItem('snake_best',best);}catch(e){} }
  document.getElementById('best').textContent = best;
}
function setDir(x,y){
  if(dir.x===-x&&dir.y===-y) return; // 반대 방향 금지
  nextDir = {x,y};
}
window.addEventListener('keydown',(e)=>{
  const k=e.key.toLowerCase();
  if(k==='arrowup'||k==='w'){setDir(0,-1);e.preventDefault();}
  else if(k==='arrowdown'||k==='s'){setDir(0,1);e.preventDefault();}
  else if(k==='arrowleft'||k==='a'){setDir(-1,0);e.preventDefault();}
  else if(k==='arrowright'||k==='d'){setDir(1,0);e.preventDefault();}
});
function bindBtn(id,x,y){ const b=document.getElementById(id); const h=(e)=>{e.preventDefault();setDir(x,y);}; b.addEventListener('touchstart',h,{passive:false}); b.addEventListener('mousedown',h); }
bindBtn('btn-up',0,-1); bindBtn('btn-down',0,1); bindBtn('btn-left',-1,0); bindBtn('btn-right',1,0);
let tsx=0,tsy=0;
canvas.addEventListener('touchstart',(e)=>{const t=e.touches[0];tsx=t.clientX;tsy=t.clientY;},{passive:true});
canvas.addEventListener('touchend',(e)=>{
  const t=e.changedTouches[0]; const dx=t.clientX-tsx, dy=t.clientY-tsy;
  if(Math.abs(dx)<20&&Math.abs(dy)<20)return;
  if(Math.abs(dx)>Math.abs(dy)) setDir(dx>0?1:-1,0); else setDir(0,dy>0?1:-1);
});

function update(dt){
  if(gameState!=='playing')return;
  moveTimer += dt;
  if(moveTimer < moveInterval) return;
  moveTimer = 0;
  dir = nextDir;
  const head = { x:snake[0].x+dir.x, y:snake[0].y+dir.y };
  // 벽 충돌
  if(head.x<0||head.x>=GRID||head.y<0||head.y>=GRID){ die(); return; }
  // 몸 충돌
  if(snake.some(s=>s.x===head.x&&s.y===head.y)){ die(); return; }
  snake.unshift(head);
  if(head.x===food.x&&head.y===food.y){
    score += 10; apples++;
    playEat();
    placeFood();
    if(moveInterval>0.06) moveInterval -= 0.004; // 점점 빠르게
    updateScore();
  } else {
    snake.pop();
  }
}
function die(){
  gameState='gameover'; playDie();
  document.getElementById('final-score').textContent=score;
  document.getElementById('final-apples').textContent=apples;
  setTimeout(()=>document.getElementById('gameover-screen').classList.remove('hidden'),400);
}
function draw(){
  if(!canvas.width)return;
  ctx.clearRect(0,0,canvas.width,canvas.height);
  // 체크 패턴
  for(let y=0;y<GRID;y++)for(let x=0;x<GRID;x++){
    if((x+y)%2===0){ ctx.fillStyle='rgba(255,255,255,0.15)'; ctx.fillRect(x*cellSize,y*cellSize,cellSize,cellSize); }
  }
  if(gameState==='playing'||gameState==='gameover'){
    // 음식 (사과)
    ctx.font = (cellSize*0.8)+'px serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('🍎', food.x*cellSize+cellSize/2, food.y*cellSize+cellSize/2);
    // 뱀
    snake.forEach((s,i)=>{
      const px=s.x*cellSize, py=s.y*cellSize;
      if(i===0){
        ctx.fillStyle='#2d7a2d';
        roundRect(px+1,py+1,cellSize-2,cellSize-2,6); ctx.fill();
        // 눈
        ctx.fillStyle='white';
        const ex=cellSize*0.28, ey=cellSize*0.32, er=cellSize*0.12;
        ctx.beginPath(); ctx.arc(px+ex,py+ey,er,0,7); ctx.arc(px+cellSize-ex,py+ey,er,0,7); ctx.fill();
        ctx.fillStyle='#222';
        ctx.beginPath(); ctx.arc(px+ex,py+ey,er*0.5,0,7); ctx.arc(px+cellSize-ex,py+ey,er*0.5,0,7); ctx.fill();
      } else {
        const g = 1 - i/snake.length*0.4;
        ctx.fillStyle = `rgb(${Math.floor(74*g)},${Math.floor(170*g)},${Math.floor(74*g)})`;
        roundRect(px+2,py+2,cellSize-4,cellSize-4,5); ctx.fill();
      }
    });
  }
}
function roundRect(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
let lastTime=0;
function loop(now){
  if(!lastTime)lastTime=now;
  const dt=Math.min(0.1,(now-lastTime)/1000); lastTime=now;
  update(dt); draw();
  requestAnimationFrame(loop);
}
resize(); draw(); requestAnimationFrame(loop);
document.getElementById('sound-toggle').textContent=soundEnabled?'🔊':'🔇';
</script>
</body>
</html>
