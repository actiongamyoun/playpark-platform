<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>게임</title>

<!-- Pretendard: 한글·영문 깔끔한 본문용 폰트 -->
<link rel="stylesheet" as="style" crossorigin
  href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />

<style>
  :root{
    --paper:#FCFCFD;        /* 종이 흰 배경 */
    --ink:#15171C;          /* 거의 검정 텍스트 */
    --muted:#8A909B;        /* 보조 텍스트 */
    --line:#E8EAEE;         /* 헤어라인 */
    --accent:#5457E6;       /* 단 하나의 포인트색: 포커스/호버/스피너 */
    --immerse:#0C0D10;      /* 전체화면 몰입 배경 */
    --pad:clamp(12px, 2.5vh, 32px);
    --r:16px;
  }

  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:"Pretendard",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }

  /* ── 무대를 화면 정중앙에 ── */
  .wrap{
    min-height:100dvh; min-height:100vh;
    display:flex; align-items:center; justify-content:center;
    padding:var(--pad);
  }

  /* ── 16:9 게임 프레임: 흰 종이 위에 살짝 떠 있게 ── */
  .stage{
    position:relative;
    aspect-ratio:16 / 9;
    width:min(100%, calc((100dvh - 2*var(--pad)) * 16 / 9));
    width:min(100%, calc((100vh - 2*var(--pad)) * 16 / 9));
    max-width:1200px;
    border-radius:var(--r);
    overflow:hidden;
    background:#fff;
    border:1px solid var(--line);
    box-shadow:0 1px 2px rgba(20,23,28,.04), 0 18px 50px -24px rgba(20,23,28,.22);
    opacity:0; transform:scale(.985);
    animation:rise .5s cubic-bezier(.2,.7,.2,1) .05s forwards;
  }
  @keyframes rise{ to{ opacity:1; transform:none; } }

  .stage iframe{
    position:absolute; inset:0;
    width:100%; height:100%;
    border:0; display:block;
  }

  /* ── 로딩 ── */
  .loader{
    position:absolute; inset:0; z-index:2;
    display:flex; flex-direction:column; gap:14px;
    align-items:center; justify-content:center;
    background:var(--paper);
    transition:opacity .35s ease;
  }
  .loader.hide{ opacity:0; pointer-events:none; }
  .spinner{
    width:34px; height:34px; border-radius:50%;
    border:3px solid var(--line);
    border-top-color:var(--accent);
    animation:spin .8s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .loader span{ font-size:13px; color:var(--muted); letter-spacing:.01em; }

  /* ── 우상단 떠 있는 컨트롤 ── */
  .controls{
    position:fixed; top:14px; right:14px; z-index:10;
    display:flex; gap:8px;
  }
  .ctrl{
    display:inline-flex; align-items:center; gap:7px;
    height:38px; padding:0 12px;
    border:1px solid var(--line);
    background:rgba(252,252,253,.82);
    backdrop-filter:saturate(160%) blur(8px);
    border-radius:10px;
    color:var(--ink); font:inherit; font-size:13px; line-height:1;
    cursor:pointer;
    transition:border-color .15s, color .15s, background .15s, transform .06s;
  }
  .ctrl svg{ width:17px; height:17px; flex:none; }
  .ctrl .label{ display:none; }
  @media (min-width:760px){ .ctrl .label{ display:inline; } }
  .ctrl:hover{ color:var(--accent); border-color:#D6D8F2; }
  .ctrl:active{ transform:translateY(1px); }
  .ctrl:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }

  /* ── 토스트 ── */
  .toast{
    position:fixed; left:50%; bottom:26px; transform:translateX(-50%) translateY(8px);
    z-index:20;
    background:var(--ink); color:#fff;
    font-size:13px; padding:10px 16px; border-radius:999px;
    opacity:0; pointer-events:none;
    transition:opacity .2s, transform .2s;
    box-shadow:0 8px 24px -8px rgba(20,23,28,.4);
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  /* ── 모바일 세로: 가로 추천 힌트 ── */
  .hint{
    position:fixed; left:50%; bottom:18px; transform:translateX(-50%);
    z-index:15;
    display:none; align-items:center; gap:8px;
    background:rgba(20,23,28,.9); color:#fff;
    font-size:12.5px; padding:9px 14px; border-radius:999px;
    transition:opacity .3s;
  }
  .hint svg{ width:15px; height:15px; }
  @media (orientation:portrait) and (max-width:760px){
    .hint.on{ display:inline-flex; }
  }

  /* ── 아래쪽 작은 보조 링크 ── */
  .fallback{
    position:fixed; left:0; right:0; bottom:8px;
    text-align:center; font-size:12px; color:var(--muted);
    z-index:5;
  }
  .fallback a{ color:var(--muted); text-decoration:underline; text-underline-offset:2px; }
  .fallback a:hover{ color:var(--ink); }

  /* ── ID 미설정 시 안내 카드 ── */
  .setup{
    display:none;
    max-width:440px; width:100%;
    padding:30px 28px;
    border:1px solid var(--line); border-radius:var(--r);
    background:#fff;
    box-shadow:0 18px 50px -28px rgba(20,23,28,.22);
  }
  .setup h1{ margin:0 0 8px; font-size:18px; font-weight:700; letter-spacing:-.01em; }
  .setup p{ margin:0 0 14px; font-size:14px; line-height:1.65; color:#4A4F59; }
  .setup ol{ margin:0; padding-left:20px; font-size:13.5px; line-height:1.85; color:#4A4F59; }
  .setup code{
    background:#F3F4F7; border:1px solid var(--line); border-radius:6px;
    padding:1px 6px; font-size:12.5px;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace; color:var(--ink);
  }

  /* ── 전체화면: 어둡게 몰입 ── */
  .wrap:fullscreen{ background:var(--immerse); padding:0; }
  .wrap:fullscreen .stage{
    width:min(100vw, calc(100vh * 16 / 9));
    max-width:none; border:0; border-radius:0;
    box-shadow:none; animation:none; opacity:1; transform:none;
  }
  .wrap:-webkit-full-screen{ background:var(--immerse); padding:0; }
  .wrap:-webkit-full-screen .stage{
    width:min(100vw, calc(100vh * 16 / 9));
    max-width:none; border:0; border-radius:0; box-shadow:none;
  }

  @media (prefers-reduced-motion:reduce){
    .stage{ animation:none; opacity:1; transform:none; }
    .spinner{ animation:none; }
    *{ transition:none !important; }
  }
</style>
</head>
<body>

<!-- =================================================================
     설정 — 이 두 줄만 바꾸면 됩니다
     ① PROJECT_ID : playentry.org 에 작품 올린 뒤, 주소
        playentry.org/project/【여기】 의 【여기】 부분을 붙여넣기
     ② GAME_TITLE : 브라우저 탭·공유 제목 (자유)
  ================================================================== -->
<script>
  const PROJECT_ID = "PASTE_PROJECT_ID_HERE";
  const GAME_TITLE = "게임";
</script>

<main class="wrap" id="wrap">
  <!-- 게임 프레임 -->
  <div class="stage" id="stage">
    <div class="loader" id="loader">
      <div class="spinner"></div>
      <span>불러오는 중…</span>
    </div>
    <!-- iframe 은 설정 확인 후 JS 가 삽입 -->
  </div>

  <!-- ID 미설정 안내 -->
  <section class="setup" id="setup">
    <h1>작품 ID를 넣어주세요</h1>
    <p>이 페이지는 엔트리 작품을 화면에 띄워 줍니다. 먼저 작품을 올리고 ID만 넣으면 바로 작동해요.</p>
    <ol>
      <li>playentry.org 로그인 → <b>작품 만들기</b></li>
      <li>상단 <b>불러오기</b>로 <code>.ent</code> 파일 업로드 → <b>저장</b></li>
      <li><b>공유하기</b>(공개)로 전환</li>
      <li>주소 <code>playentry.org/project/<b>ID</b></code> 의 <b>ID</b>를 복사</li>
      <li>이 파일 위쪽 <code>PROJECT_ID</code> 에 붙여넣기</li>
    </ol>
  </section>
</main>

<!-- 컨트롤 -->
<div class="controls" id="controls" hidden>
  <button class="ctrl" id="btnShare" type="button" aria-label="링크 복사">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/></svg>
    <span class="label">공유</span>
  </button>
  <button class="ctrl" id="btnFull" type="button" aria-label="전체화면">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M21 16v3a2 2 0 0 1-2 2h-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
    <span class="label">전체화면</span>
  </button>
</div>

<!-- 모바일 세로 힌트 -->
<div class="hint" id="hint">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="2" width="14" height="20" rx="2"/><path d="M9 18h6"/></svg>
  가로로 돌리면 더 크게 즐길 수 있어요
</div>

<!-- 보조 링크 -->
<div class="fallback" id="fallback" hidden>
  게임이 안 보이나요? <a id="openNew" href="#" target="_blank" rel="noopener">새 탭에서 열기</a>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  const placeholder = /PASTE_|여기|_HERE/i.test(PROJECT_ID) || !PROJECT_ID.trim();
  const $ = (id) => document.getElementById(id);
  const stage = $("stage"), loader = $("loader"), setup = $("setup"),
        controls = $("controls"), fallback = $("fallback"), hint = $("hint"),
        toast = $("toast"), wrap = $("wrap");

  // 탭 제목
  document.title = GAME_TITLE || "게임";

  // ── ID 미설정: 안내 카드만 ──
  if (placeholder){
    stage.style.display = "none";
    setup.style.display = "block";
    return;
  }

  // ── 게임 iframe 삽입 ──
  const id = PROJECT_ID.trim();
  const iframe = document.createElement("iframe");
  iframe.src = "https://playentry.org/iframe/" + id;
  iframe.title = GAME_TITLE || "게임";
  iframe.allow = "autoplay; fullscreen; gamepad; accelerometer; gyroscope";
  iframe.setAttribute("allowfullscreen", "");
  stage.appendChild(iframe);

  // 로딩 종료 (iframe load + 안전 타임아웃)
  let done = false;
  const finishLoad = () => {
    if (done) return; done = true;
    loader.classList.add("hide");
    controls.hidden = false;
    fallback.hidden = false;
  };
  iframe.addEventListener("load", finishLoad);
  setTimeout(finishLoad, 12000); // 혹시 load 이벤트를 못 받아도 컨트롤은 노출

  // 보조 링크
  $("openNew").href = "https://playentry.org/project/" + id;

  // ── 토스트 ──
  let toastTimer;
  const showToast = (msg) => {
    toast.textContent = msg;
    toast.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove("show"), 1900);
  };

  // ── 공유 ──
  $("btnShare").addEventListener("click", async () => {
    const url = location.href;
    if (navigator.share){
      try { await navigator.share({ title: document.title, url }); return; }
      catch(e){ if (e && e.name === "AbortError") return; }
    }
    try {
      await navigator.clipboard.writeText(url);
      showToast("링크를 복사했어요");
    } catch(e){
      // 보안 컨텍스트가 아니면 클립보드 실패 → 수동 안내
      window.prompt("이 링크를 복사하세요", url);
    }
  });

  // ── 전체화면 ──
  const reqFull = wrap.requestFullscreen || wrap.webkitRequestFullscreen;
  const exitFull = document.exitFullscreen || document.webkitExitFullscreen;
  $("btnFull").addEventListener("click", () => {
    const fsEl = document.fullscreenElement || document.webkitFullscreenElement;
    if (!fsEl){ reqFull && reqFull.call(wrap); }
    else { exitFull && exitFull.call(document); }
  });

  // ── 모바일 세로 힌트: 세로일 때 잠깐 노출 후 사라짐 ──
  const portrait = () =>
    window.matchMedia("(orientation:portrait) and (max-width:760px)").matches;
  const maybeHint = () => {
    if (portrait()){
      hint.classList.add("on");
      hint.style.opacity = "1";
      setTimeout(() => { hint.style.opacity = "0"; }, 3600);
    } else {
      hint.classList.remove("on");
    }
  };
  maybeHint();
  window.addEventListener("orientationchange", () => setTimeout(maybeHint, 300));
})();
</script>
</body>
</html>
